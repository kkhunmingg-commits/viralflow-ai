name: Thai TTS CPU benchmark

# Runs only when this benchmark branch is pushed; it never deploys or posts anything.
on:
  push:
    branches: ['claude/tts-benchmark']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OUT_DIR: tts-out
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Machine
        run: nproc; free -m; lscpu | grep 'Model name'
      - name: Install CPU-only VoxCPM2 and licence tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu "voxcpm==2.0.3" soundfile pip-licenses
          sudo apt-get update && sudo apt-get install -y espeak-ng
          mkdir -p tts-out
          pip-licenses --format=json --with-urls > tts-out/python-licenses.json
          pip-licenses --format=markdown --order=license | tee tts-out/python-licenses.md
          dpkg -s espeak-ng | grep -E '^(Version|Package)' > tts-out/espeak-ng-version.txt
      - name: espeak-ng baseline
        run: python scripts/thai-tts/benchmark.py espeak-ng
      - name: VoxCPM2 on CPU
        run: /usr/bin/time -v python scripts/thai-tts/benchmark.py voxcpm2 2> tts-out/voxcpm2-time.txt; tail -25 tts-out/voxcpm2-time.txt
      - name: App adapter end to end
        run: |
          echo '{"text":"รู้ไหม เรื่องนี้มีเหตุผล","voice":"A warm, clear Thai female narrator","output":"tts-out/adapter-check.wav"}' \
            | VOXCPM_MODEL=$(python -c 'from huggingface_hub import snapshot_download;print(snapshot_download("openbmb/VoxCPM2"))') VOXCPM_DEVICE=cpu python scripts/thai-tts/voxcpm2_tts.py
          python -c 'import soundfile as sf;print(sf.info("tts-out/adapter-check.wav"))'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: thai-tts-benchmark
          path: tts-out/
