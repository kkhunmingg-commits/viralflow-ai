name: Real product AI video test

# One real product, a licensed photo of it, and image-to-video with a free open-weights model on CPU.
# Never posts, never deploys, no paid API. Runs only on this test branch and only when the commit message asks.
on:
  push:
    branches: ['claude/real-product-video-test']

permissions:
  contents: write

jobs:
  smoke:
    if: contains(github.event.head_commit.message, '[video-smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Free disk for model weights
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h / && nproc && free -m
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Licensed product photos on Wikimedia Commons
        run: python scripts/product-video/commons_candidates.py "Category:Casio F-91W" out/commons
      - name: Video runtime
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m venv .venv-video
          .venv-video/bin/pip install --quiet --extra-index-url https://download.pytorch.org/whl/cpu torch "diffusers==0.41.0" transformers \
            sentencepiece accelerate safetensors huggingface_hub imageio imageio-ffmpeg Pillow
          .venv-video/bin/pip freeze | grep -i -E "^(torch|diffusers|transformers)==" | tee out/versions.txt
      - name: Tiny run proves the pipeline end to end
        run: |
          mkdir -p out/smoke
          echo '{"image":"out/commons/previews/00.jpg","prompt":"A black digital wristwatch on a wooden table, slow camera push in, soft studio light","output":"out/smoke/tiny.mp4","width":256,"height":448,"frames":9,"seed":1}' \
            | .venv-video/bin/python scripts/product-video/ltx_i2v.py 2>out/smoke/tiny.err | tee out/smoke/tiny.json
      - name: Full-size timing with two steps
        run: |
          echo '{"image":"out/commons/previews/00.jpg","prompt":"A black digital wristwatch on a wooden table, slow camera push in, soft studio light","output":"out/smoke/full-2step.mp4","width":480,"height":832,"frames":97,"seed":1,"timesteps":[1000,0.03]}' \
            | timeout 3600 .venv-video/bin/python scripts/product-video/ltx_i2v.py 2>out/smoke/full.err | tee out/smoke/full.json
          free -m
      - name: Publish results to a results branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/results && cp -r out /tmp/results/ 2>/dev/null || true
          cd /tmp/results && git init -q -b results && git add -A
          git -c user.name=viralflow-pilot -c user.email=pilot@users.noreply.github.com commit -qm "Product video smoke ${{ github.run_id }}"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" HEAD:refs/heads/claude/pilot-results-${{ github.run_id }}-video-smoke
