# Developer training recipe; no training is run automatically.
# The approved training workstation substitutes the fixed managed paths below
# only after the companion rights/dependency preflight passes. Original reference
# recordings stay encrypted; upstream path-based loading is not authorized until
# an encrypted/in-memory dataset loader is supplied.
# Derived from official conf/voxcpm_v2/voxcpm_finetune_lora.yaml (Apache-2.0).
pretrained_path: MANAGED_VERIFIED_VOXCPM2_DIRECTORY
train_manifest: APPROVED_ENCRYPTED_TRAINING_MANIFEST
val_manifest: APPROVED_ENCRYPTED_VALIDATION_MANIFEST
sample_rate: 16000
out_sample_rate: 48000
batch_size: 1
grad_accum_steps: 16
num_workers: 0
preprocessing_num_workers: 1
num_iters: 1000
log_interval: 10
valid_interval: 100
save_interval: 250
learning_rate: 0.0001
weight_decay: 0.01
warmup_steps: 100
max_steps: 1000
max_batch_tokens: 4096
max_grad_norm: 1.0
save_path: APPROVED_ENCRYPTED_MODEL_OUTPUT
tensorboard: APPROVED_LOCAL_METRICS_ONLY
lambdas:
  loss/diff: 1.0
  loss/stop: 1.0
lora:
  enable_lm: true
  enable_dit: true
  enable_proj: false
  r: 32
  alpha: 32
  dropout: 0.0
hf_model_id: openbmb/VoxCPM2
distribute: false
